services:
  - type: web
    name: flowsync-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: FLOWSYNC_ENV
        value: production
      - key: FLOWSYNC_ROUTING_PROVIDER
        value: mock
      - key: FLOWSYNC_GEOCODING_PROVIDER
        value: sqlite
      - key: FLOWSYNC_MOCK_FALLBACK
        value: "true"
      - key: FLOWSYNC_ROUTING_API_KEY
        sync: false
      - key: FLOWSYNC_GEOCODING_API_KEY
        sync: false
      - key: FLOWSYNC_ROUTING_BASE_URL
        sync: false
      - key: FLOWSYNC_GEOCODING_BASE_URL
        sync: false
